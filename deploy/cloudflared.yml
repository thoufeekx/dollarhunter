# Locally managed tunnel: every hostname routed to this tunnel (the origin hostname and any Cloudflare for
# SaaS custom hostname) is served by the Dollar Hunter web container. TUNNEL_ID is filled in at deploy time.
tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json
no-autoupdate: true
ingress:
  - service: http://web:8000

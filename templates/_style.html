<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>
:root{--fg:#111;--muted:#555;--line:#e3e3e3;--accent:#0a7d3b;--warn-bg:#fff7e0;--warn-line:#e8d48a;--bg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--muted:#aaa;--line:#333;--accent:#3fbf6f;--warn-bg:#2b2610;--warn-line:#6b5d1f;--bg:#121212}}
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;max-width:620px;margin:4vh auto;padding:0 16px;color:var(--fg);background:var(--bg)}
h1{font-size:1.6rem;margin-bottom:.2rem}.muted{color:var(--muted);font-size:.9rem}
table{width:100%;border-collapse:collapse;margin:12px 0}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}input[type=text],input[type=number],input[type=tel],textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
input.qty{width:4.5em}.btn{display:inline-block;border:0;background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;font-weight:500}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);padding:10px 12px;border-radius:8px;margin:16px 0;font-size:.9rem}
.tot td{font-weight:600}form.inline{display:inline}
</style>
